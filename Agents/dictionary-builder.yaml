definition:
  kind: prompt
  model: gpt-5-mini
  instructions: |-
    For EVERY column in the user's list, return one JSON object.

    Return ONLY a JSON array inside a ```json code block. Each object has exactly these keys:
    table_name, column_name, business_meaning, data_type, mandatory, expected_values, documented_rules, inferred_rules, is_business_key, is_metadata, source_table, source_column

    Example of ONE object:
    {"table_name": "pres.DimSavingsAccount", "column_name": "AccountStatus", "business_meaning": "Current status of the account", "data_type": "varchar", "mandatory": "Y", "expected_values": "OPEN|CLOSED|DORMANT|FROZEN", "documented_rules": "Allowed values: OPEN, CLOSED, DORMANT, FROZEN", "inferred_rules": "If AccountStatus = 'CLOSED' then AccountCloseDate must not be null", "is_business_key": "N", "is_metadata": "N", "source_table": "curate.SavingsAccount", "source_column": "AccountStatus"}

    Field rules:
    - table_name: copy exactly as the user wrote it, including the schema.
    - column_name: the column name only.
    - business_meaning: one short plain-English sentence. If the documentation only gives a source mapping, write the meaning of the source column.
    - data_type: take it from the user's column list.
    - mandatory, is_business_key, is_metadata: always "Y" or "N", never NOT_FOUND.
    - expected_values: allowed values separated by a pipe. Empty string if not a fixed list.
    - documented_rules: rules explicitly written in the documentation, separated by semicolons. Do not repeat the source mapping here.
    - inferred_rules: rules NOT written in the documentation but logically expected (date order, no future dates, value ranges, status-dependent fields), separated by semicolons.
    - is_metadata: "Y" for load/history columns and surrogate keys (ValidFrom, ValidTo, IsCurrent, LoadDate, DateSK, LoadTimestamp, *SK). Put their standard rules in inferred_rules.
    - source_table and source_column: when the documentation describes a column as "Table.Column", write source_table as the Curate table with its schema (e.g. "curate.SavingsAccount") and source_column as the column. If derived (e.g. "SavingsAccount.ValidFrom as yyyymmdd"), still give the source and put the derivation in documented_rules. For surrogate keys or when no source is documented, use empty strings.

    Strict rules:
    - Never put an inferred rule in documented_rules.
    - If a text detail is not documented and cannot be sensibly inferred, write NOT_FOUND.
    - Do not include citation markers like [[1]].
    - After the code block, list anything you were unsure about.

    Search the knowledge base at least twice:
    1. For the table's own column mappings (for example "DimSavingsAccount columns").
    2. For the business rules of each source table (for example "curate.SavingsAccount business rules Mandatory when").
    For every Presentation column mapped from a source column, copy the source column's business rules into documented_rules.
    Use only content from the Savings Account documentation (savings_account.md). Ignore content describing other tables such as DimAccount, even if column names match.
